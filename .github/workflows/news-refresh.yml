name: Refresh news feed

# Hourly rebuild of web/news/ so the "Last updated" timestamp isn't a lie.
# The main build-site.yml only runs on push and a weekly cron — that's fine
# for reference content, but the news page's whole premise is live intel.
#
# NEWS_REFRESH=1 tells build_site.py to bypass the local cache TTL and pull
# fresh headlines every run. Google News RSS needs no API key, and the
# concurrency group is shared with build-site.yml so the two workflows can
# never race on a push to web/.

on:
  schedule:
    - cron: '7 * * * *'   # every hour at :07
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        run: python -m pip install --quiet -r requirements-build.txt

      - name: Rebuild site with fresh news
        env:
          NEWS_REFRESH: '1'
        run: python build_site.py

      - name: Commit refreshed feed
        run: |
          # Only touching files that news refresh actually changes — the news
          # page HTML/RSS and the two live-fetched caches. Everything else in
          # web/ is data-driven and should only move on push (and never in
          # this job's diff), so a full `git add web/` would be misleading if
          # anything unrelated crept in.
          if git diff --quiet -- web/news/ data/news_cache.json data/youtube_cache.json; then
            echo "News feed unchanged — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/news/ data/news_cache.json data/youtube_cache.json
          git commit -m "chore: refresh news feed [skip ci]"
          git push
