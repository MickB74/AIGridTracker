name: Refresh news feed

# Rebuild web/news/ every few hours so the "Last updated" timestamp isn't a
# lie. The news page's premise is live intel, but *hourly* was overkill: each
# run that finds new headlines commits and thus fires a Vercel deploy, and 24
# of those a day was the dominant drain on the Hobby deploy budget. Every 4
# hours keeps the feed fresh (6 deploys/day at most) without the churn. Bump
# it back toward hourly only if the feed genuinely needs to be that live.
#
# NEWS_REFRESH=1 tells build_site.py to bypass the local cache TTL and pull
# fresh headlines every run. Google News RSS needs no API key, and the
# concurrency group is shared with build-site.yml so the two workflows can
# never race on a push to web/.

on:
  schedule:
    - cron: '7 */4 * * *'   # every 4 hours at :07
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        run: python -m pip install --quiet -r requirements-build.txt

      - name: Rebuild site with fresh news
        env:
          NEWS_REFRESH: '1'
        run: python build_site.py

      - name: Commit refreshed feed
        run: |
          # Only touching files that news refresh actually changes — the news
          # page HTML/RSS, the two live-fetched caches, and the story tracker
          # (which _persist_story_candidates updates on every build since it
          # accumulates the same fetched headlines). Everything else in web/
          # is data-driven and should only move on push (and never in this
          # job's diff), so a full `git add web/` would be misleading if
          # anything unrelated crept in.
          FILES="web/news/ web/story-tracker.html web/data/story_tracker.json
                 data/news_cache.json data/youtube_cache.json
                 data/story_candidates.json"
          if git diff --quiet -- $FILES; then
            echo "News feed unchanged — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "chore: refresh news feed [skip ci]"
          git push
