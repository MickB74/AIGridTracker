name: SPIKE — youtube-transcript-api connectivity test

# Throwaway. Answers one question: does a GitHub Actions runner's IP get
# blocked by YouTube's unofficial caption endpoint? Manual trigger only —
# never runs on push or schedule. Delete this file once answered.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install youtube-transcript-api
        run: python -m pip install --quiet youtube-transcript-api

      - name: Run connectivity spike
        run: python scripts/spike_youtube_transcript.py
