name: Build static site

# web/ is committed and served by Vercel as-is, so it must be regenerated
# whenever the data behind it changes. Doing that by hand means a forgotten
# `python3 build_site.py` ships a site that silently disagrees with
# constants.py — the exact failure REGISTRY_PROVENANCE exists to prevent,
# reintroduced at the deploy layer. This runs the build instead.
#
# The daily schedule is not busywork: /news/ and the per-state headline
# sections are fetched at BUILD time, so on a static site "this week's
# headlines" freeze at whenever the site was last built — a weekly cadence
# left them up to six days stale. Daily also keeps registry_provenance()'s
# "1y 1m ago" strings and stale flags honest without anyone touching the repo.

on:
  push:
    branches: [master, 'ci/**', 'feat/**', 'chore/**']
    # Never re-trigger on the bot's own output. (GITHUB_TOKEN pushes don't
    # start workflows anyway — this is belt and braces, and it keeps the
    # Actions log readable.)
    paths-ignore: ['web/**']
  schedule:
    - cron: '17 10 * * *'  # daily 10:17 UTC (early-morning US) — fresh news
  workflow_dispatch:

permissions:
  contents: write

# Two builds racing to commit web/ would conflict on push.
concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        run: python -m pip install --quiet -r requirements-build.txt

      # Printed so a future byte-level divergence in generated artifacts can
      # be traced to a version without another round of guessing.
      - name: Record build environment
        run: python -c "import sys,pandas,fpdf,markdown; print('python', sys.version.split()[0]); print('pandas', pandas.__version__); print('fpdf2', fpdf.__version__); print('markdown', markdown.__version__)"

      - name: Build site
        # NEWS_REFRESH=1 bypasses the 6h news/YouTube cache TTL so every CI
        # build ships current headlines regardless of the committed cache age.
        run: NEWS_REFRESH=1 python build_site.py

      - name: Show what changed
        run: |
          if git diff --quiet -- web/; then
            echo "web/ is already up to date with the data."
          else
            echo "web/ differs from the committed output:"
            git --no-pager diff --stat -- web/ | tail -20
          fi

      # On branches this is a dry run: it proves the build works and shows the
      # diff without writing anything. Only master gets the commit.
      - name: Commit regenerated site
        if: github.ref == 'refs/heads/master'
        run: |
          # The news/YouTube caches are committed alongside web/ so the repo
          # records exactly what the published site was built from. Daily
          # commits are expected now — the news feed changes every day. What
          # would still be a bug is web/ churning when data/ *didn't* change;
          # check "Record build environment" above if that starts happening.
          if git diff --quiet -- web/ data/news_cache.json data/youtube_cache.json data/story_candidates.json; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/ data/news_cache.json data/youtube_cache.json data/story_candidates.json
          git commit -m "chore: rebuild static site [skip ci]"
          git push
