name: Build static site

# web/ is committed and served by Vercel as-is, so it must be regenerated
# whenever the data behind it changes. Doing that by hand means a forgotten
# `python3 build_site.py` ships a site that silently disagrees with
# constants.py — the exact failure REGISTRY_PROVENANCE exists to prevent,
# reintroduced at the deploy layer. This runs the build instead.
#
# The daily schedule is not busywork: /news/ and the per-state headline
# sections are fetched at BUILD time, so on a static site "this week's
# headlines" freeze at whenever the site was last built — a weekly cadence
# left them up to six days stale. Daily also keeps registry_provenance()'s
# "1y 1m ago" strings and stale flags honest without anyone touching the repo.

on:
  # Deliberately NOT triggered on push. Every push here used to fire a full
  # rebuild that committed web/, and *that* commit triggered its own Vercel
  # deploy — so one source change cost two deploys, and on a busy day the
  # Hobby deploy budget drained fast. Committers rebuild web/ locally before
  # pushing (that is the workflow), so the push-time rebuild was almost always
  # a no-op-plus-fresh-news-timestamp. The daily cron below still catches any
  # drift within 24h, and `workflow_dispatch` lets you force one by hand.
  schedule:
    - cron: '17 10 * * *'  # daily 10:17 UTC (early-morning US) — full rebuild
  workflow_dispatch:

permissions:
  contents: write

# Two builds racing to commit web/ would conflict on push.
concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        run: python -m pip install --quiet -r requirements-build.txt

      # Printed so a future byte-level divergence in generated artifacts can
      # be traced to a version without another round of guessing.
      - name: Record build environment
        run: python -c "import sys,pandas,fpdf,markdown; print('python', sys.version.split()[0]); print('pandas', pandas.__version__); print('fpdf2', fpdf.__version__); print('markdown', markdown.__version__)"

      - name: Build site
        # NEWS_REFRESH=1 bypasses the 6h news/YouTube cache TTL so every CI
        # build ships current headlines regardless of the committed cache age.
        run: NEWS_REFRESH=1 python build_site.py

      # Mines the freshly-rebuilt story archive for towns/counties that keep
      # recurring in unlocalized headlines but aren't in the gazetteer yet —
      # writes candidates to a review queue, capped at 39/day. Never touches
      # LOCAL_BODIES_DF/MORATORIUMS_DF itself; promotion stays a human (or a
      # Claude Code session doing real research) verifying each one against
      # its own governing-body page. See scripts/scan_locality_candidates.py.
      - name: Scan for untracked localities
        run: python scripts/scan_locality_candidates.py

      # Mines the same story archive for moratorium-related headlines that
      # aren't in MORATORIUMS_DF yet — broader keyword net than the weekly
      # news-scan scanner. Writes to the same moratorium_candidates.json
      # review queue; promotion is still a human step.
      - name: Sweep archive for moratorium candidates
        run: python scripts/sweep_moratoriums_from_archive.py

      # Mines the news feed for state legislatures / PUCs / energy offices
      # publishing data-center studies not yet in STATE_STUDIES — including
      # newer editions for states already covered. Writes to a review queue;
      # promotion means a human reading the actual report. See
      # scripts/scan_study_candidates.py.
      - name: Scan for new state studies
        run: python scripts/scan_study_candidates.py

      - name: Show what changed
        run: |
          if git diff --quiet -- web/; then
            echo "web/ is already up to date with the data."
          else
            echo "web/ differs from the committed output:"
            git --no-pager diff --stat -- web/ | tail -20
          fi

      # On branches this is a dry run: it proves the build works and shows the
      # diff without writing anything. Only master gets the commit.
      - name: Commit regenerated site
        if: github.ref == 'refs/heads/master'
        run: |
          # The news/YouTube caches are committed alongside web/ so the repo
          # records exactly what the published site was built from. Daily
          # commits are expected now — the news feed changes every day. What
          # would still be a bug is web/ churning when data/ *didn't* change;
          # check "Record build environment" above if that starts happening.
          if git diff --quiet -- web/ data/news_cache.json data/youtube_cache.json data/story_candidates.json data/locality_candidates.json data/moratorium_candidates.json data/study_candidates.json; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/ data/news_cache.json data/youtube_cache.json data/story_candidates.json data/locality_candidates.json data/moratorium_candidates.json data/study_candidates.json
          git commit -m "chore: rebuild static site [skip ci]"
          git push
