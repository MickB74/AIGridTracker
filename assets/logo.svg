<svg viewBox="0 0 540 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F98866"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F98866"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="pulseGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(55, 52)">
    <polygon points="0,-45 39,-22.5 39,22.5 0,45 -39,22.5 -39,-22.5"
             fill="none" stroke="url(#tealGrad)" stroke-width="2.2" opacity="0.9"/>
    <polygon points="0,-28 24.2,-14 24.2,14 0,28 -24.2,14 -24.2,-14"
             fill="none" stroke="url(#tealGrad)" stroke-width="1.3" opacity="0.5"/>
    <line x1="-39" y1="0" x2="39" y2="0" stroke="#2DD4BF" stroke-width="0.8" opacity="0.3"/>
    <line x1="-19.5" y1="-33.5" x2="19.5" y2="33.5" stroke="#2DD4BF" stroke-width="0.8" opacity="0.3"/>
    <line x1="19.5" y1="-33.5" x2="-19.5" y2="33.5" stroke="#2DD4BF" stroke-width="0.8" opacity="0.3"/>
    <circle cx="0" cy="-45" r="2.5" fill="#2DD4BF" opacity="0.7"/>
    <circle cx="39" cy="-22.5" r="2.5" fill="#2DD4BF" opacity="0.7"/>
    <circle cx="39" cy="22.5" r="2.5" fill="#2DD4BF" opacity="0.7"/>
    <circle cx="0" cy="45" r="2.5" fill="#2DD4BF" opacity="0.7"/>
    <circle cx="-39" cy="22.5" r="2.5" fill="#2DD4BF" opacity="0.7"/>
    <circle cx="-39" cy="-22.5" r="2.5" fill="#2DD4BF" opacity="0.7"/>
    <polyline points="-6,-23 3,-5 -5,-5 6,23"
              fill="none" stroke="url(#pulseGrad)" stroke-width="3"
              stroke-linecap="round" stroke-linejoin="round"
              filter="url(#pulseGlow)"/>
    <circle cx="0" cy="0" r="3.2" fill="#FBBF24" filter="url(#glow)" opacity="0.9"/>
    <path d="M 0,-37 A 37,37 0 0,1 32,-18.5"
          fill="none" stroke="#2DD4BF" stroke-width="1.8" opacity="0.6"
          stroke-linecap="round"/>
    <path d="M 32,18.5 A 37,37 0 0,1 0,37"
          fill="none" stroke="#2DD4BF" stroke-width="1.8" opacity="0.4"
          stroke-linecap="round"/>
  </g>
  <g transform="translate(115, 52)">
    <rect x="0" y="-14" width="42" height="26" rx="5"
          fill="url(#tealGrad)" opacity="0.15"/>
    <rect x="0" y="-14" width="42" height="26" rx="5"
          fill="none" stroke="#2DD4BF" stroke-width="1.1" opacity="0.5"/>
    <text x="21" y="4" font-family="'IBM Plex Mono', ui-monospace, monospace"
          font-size="15" font-weight="600" text-anchor="middle"
          fill="#2DD4BF">AI</text>
    <text x="54" y="7" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif"
          font-size="40" font-weight="700" letter-spacing="-0.03em"
          fill="#EAF0F7">Grid<tspan fill="url(#tealGrad)">Watch</tspan></text>
    <text x="56" y="30" font-family="'Space Grotesk', system-ui, sans-serif"
          font-size="11" font-weight="400" letter-spacing="0.12em"
          fill="#6B7789">COMMUNITY ENERGY INTELLIGENCE</text>
  </g>
</svg>
